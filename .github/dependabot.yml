version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/"
      - "/source/functions/discover_resources"
      - "/custom-resource-package"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
